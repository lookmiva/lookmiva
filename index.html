<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOOKMIVA - PRIVATE PROMPT SANCTUM</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#e5e5e5;font-family:'Inter',sans-serif;min-height:100vh;display:flex;flex-direction:column}
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 20px;position:relative}
.badge{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:6px 14px;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;margin-bottom:32px}
.badge .dot{width:6px;height:6px;background:#22c55e;border-radius:50%;box-shadow:0 0 8px #22c55e}
.subtitle{font-size:11px;letter-spacing:0.35em;text-transform:uppercase;color:#888;margin-bottom:18px}
.title{font-family:'Playfair Display',serif;font-size:clamp(48px,9vw,96px);font-weight:600;letter-spacing:-0.02em;line-height:0.9;margin-bottom:18px}
.tagline{font-size:14px;letter-spacing:0.35em;text-transform:uppercase;color:#666;margin-bottom:80px}
.vault-panel{width:100%;max-width:720px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:24px;text-align:left;backdrop-filter:blur(20px)}
.vault-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid rgba(255,255,255,0.08)}
.vault-title{font-size:12px;letter-spacing:0.2em;text-transform:uppercase;color:#fff;font-weight:600}
.vault-status{font-size:11px;color:#22c55e;display:flex;align-items:center;gap:6px}
.prompt-item{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:16px;margin-bottom:12px;transition:all 0.2s}
.prompt-item:hover{background:rgba(255,255,255,0.06);border-color:rgba(255,255,255,0.12)}
.prompt-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.prompt-title{font-size:13px;font-weight:600;color:#fff;letter-spacing:0.02em}
.prompt-level{font-size:10px;letter-spacing:0.15em;text-transform:uppercase;padding:4px 8px;border-radius:999px;background:rgba(255,215,0,0.12);border:1px solid rgba(255,215,0,0.25);color:#FFD700}
.prompt-content{font-size:13px;color:#aaa;line-height:1.5}
.prompt-id{font-size:10px;color:#555;margin-top:8px;font-family:monospace}
.empty{color:#666;font-size:13px;text-align:center;padding:20px}
.footer{padding:24px;text-align:center;font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:#333}
</style>
</head>
<body>
<div class="hero">
<div class="badge"><span class="dot"></span> Vercel + Supabase Secured Vault — SYSTEM SECURE</div>
<div class="subtitle">PRIVATE PROMPT SANCTUM</div>
<div class="title">LOOKMIVA</div>
<div class="tagline">THE UNSEEN STANDARD.</div>

<div class="vault-panel" id="vaultPanel">
<div class="vault-header">
<div class="vault-title">🔐 VAULT LOG - SINGAPORE</div>
<div class="vault-status" id="vaultStatus"><span class="dot"></span> CONNECTING...</div>
</div>
<div id="vaultContent"><div class="empty">Memuat brankas...</div></div>
</div>
</div>
<div class="footer">LOOKMIVA SHIELD PROTOCOL ACTIVE — ap-southeast-1 — zzwdefplvcimaovkwdvk</div>

<script>
// GANTI DENGAN KUNCI ASLI KAMU BEBZ! Copy dari Supabase Settings -> API
const SUPABASE_URL = 'https://zzwdefplvcimaovkwdvk.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp6d2RlZnBsdmNpbWFvdmt3ZHZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMDc1NTAsImV4cCI6MjEwNzg4MzU1MH0.GYjivDjIjshu58xYxDzgNojB-nIiu-4ML4u9DYb50hw'; 

// Jika anon key belum diganti, tampilkan petunjuk
const vaultContent = document.getElementById('vaultContent');
const vaultStatus = document.getElementById('vaultStatus');

if (SUPABASE_ANON_KEY.includes('PASTE_ANON')) {
  vaultStatus.innerHTML = '⚠️ ANON KEY BELUM DIPASANG';
  vaultStatus.style.color = '#f59e0b';
  vaultContent.innerHTML = `
    <div class="prompt-item">
      <div class="prompt-title">🔑 LANGKAH TERAKHIR BEBZ!</div>
      <div class="prompt-content" style="margin-top:12px">
        1. Buka Supabase -> Settings -> API<br>
        2. Copy <b>anon public</b> key yang panjang itu<br>
        3. Buka file ini di Notepad, cari tulisan PASTE_ANON_KEY_KAMU_DI_SINI_BEBZ<br>
        4. Paste kunci asli kamu di situ, save, upload lagi ke GitHub!<br><br>
        <b>Project URL kamu udah bener:</b> ${SUPABASE_URL}<br>
        Tapi tanpa anon key, website belum bisa baca tabel prompts yang isinya 1 record tadi!
      </div>
    </div>
    <div class="prompt-item" style="border-color:rgba(34,197,94,0.3)">
      <div class="prompt-meta"><div class="prompt-title">✅ TEST VAULT 01 - LOOKMIVA SHIELD</div><div class="prompt-level">SANCTUM</div></div>
      <div class="prompt-content">Prompt rahasia pertama kita! Undetectable & Unbreakable! (Preview lokal - belum dari Supabase)</div>
      <div class="prompt-id">ID: 7ac97bee-1ed6-41de-9c8c-9d01a5069 • Singapore • ap-southeast-1</div>
    </div>
  `;
} else {
  // Konek beneran ke Supabase
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  
  async function loadVault() {
    try {
      const { data, error } = await supabase
        .from('prompts')
        .select('*')
        .order('created_at', { ascending: false });
      
      if (error) throw error;
      
      vaultStatus.innerHTML = `<span class="dot"></span> ${data.length} PROMPT SECURED • SANCTUM ACTIVE`;
      vaultStatus.style.color = '#22c55e';
      
      if (data.length === 0) {
        vaultContent.innerHTML = '<div class="empty">Brankas kosong - belum ada prompt</div>';
      } else {
        vaultContent.innerHTML = data.map(p => `
          <div class="prompt-item">
            <div class="prompt-meta">
              <div class="prompt-title">${p.title || 'Untitled'}</div>
              <div class="prompt-level">${p.level || 'SANCTUM'}</div>
            </div>
            <div class="prompt-content">${p.encrypted_content || p.content || '-'}</div>
            <div class="prompt-id">ID: ${p.id} • ${new Date(p.created_at).toLocaleString('id-ID')}</div>
          </div>
        `).join('');
      }
    } catch (err) {
      vaultStatus.innerHTML = '❌ CONNECTION ERROR';
      vaultStatus.style.color = '#ef4444';
      vaultContent.innerHTML = `<div class="prompt-item"><div class="prompt-title">Error</div><div class="prompt-content">${err.message}<br><br>Pastikan RLS Policy sudah: Allow all for anon (di Supabase Table Editor -> RLS policy)</div></div>`;
      console.error(err);
    }
  }
  
  loadVault();
}
</script>
</body>
</html>
